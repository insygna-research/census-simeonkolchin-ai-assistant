name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff pytest

      - name: Lint (ruff)
        run: ruff check --select=E9,F63,F7,F82 .

      - name: Test (pytest)
        run: pytest -q
